<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery · Furqan Photography</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">F</span>
      <div>
        <h1>Gallery</h1>
        <p>Inspect each image with project details and story notes.</p>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="section-block">
      <div class="section-header">
        <span class="eyebrow">Photo Gallery</span>
        <h2>Open any image story in full detail</h2>
      </div>
      <div class="filter-bar">
        <input id="filter-search" type="search" placeholder="Search by title, category, or description" />
        <select id="filter-category">
          <option value="">All categories</option>
        </select>
        <div id="gallery-count" class="gallery-count">0 items</div>
      </div>
      <div class="card-grid" id="gallery-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Furqan Photography · <a href="https://github.com/moizahmedk/Furqan_Portfolio" target="_blank">GitHub repo</a></p>
  </footer>

  <script src="assets/js/gallery.js"></script>
</body>
</html>
